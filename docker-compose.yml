version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: payment_gateway
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
      # POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --http-port=8083
    ports:
      - "8083:8083"
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/payment_gateway
      - DATABASE_USER=payment_user
      - DATABASE_PASSWORD=payment_pass
      - KAFKA_BOOTSTRAP=kafka:9092
      - JWKS_URI=http://keycloak:8083/realms/payments/protocol/openid-connect/certs
    depends_on:
      - postgres
      - kafka
      - keycloak

volumes:
  pgdata:
