server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payment_gateway}
    username: ${DATABASE_USER:payment_user}
    password: ${DATABASE_PASSWORD:payment_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: payment-gateway
      properties:
        spring.json.trusted.packages: "*"

  flyway:
    enabled: true
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8083/realms/payments/protocol/openid-connect/certs}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

integration:
  corebank:
    url: http://localhost:8081   # ganti sesuai alamat CoreBank service
  biller:
    url: http://localhost:8082   # ganti sesuai alamat Biller service
